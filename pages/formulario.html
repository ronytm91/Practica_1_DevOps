<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>EventBuilder - Formulario</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body style="padding-top: 60px;">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    
    <!-- Navbar (sin cambios) -->
    <nav class="navbar navbar-expand-lg bg-white border-b border-gray-200 shadow-sm py-3 px-4 fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand flex items-center" href="index.html">
                <img src="../img/Logo64.png" alt="EventBuilder Logo">
                <span class="text-lg font-bold text-dark">EventBuilder</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="menu">
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <div class="dropdown">
                        <a class="text-dark nav-link d-flex align-items-center dropdown-toggle" href="#"
                            id="languageDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-globe me-2"></i> ES
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="languageDropdown">
                            <li><a class="dropdown-item" href="#">Español</a></li>
                            <li><a class="dropdown-item" href="#">English</a></li>
                            <li><a class="dropdown-item" href="#">French</a></li>
                        </ul>
                    </div>
                    <a href="#" class="btn btn-outline-light text-dark">Inicia Sesión</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal del formulario con margen superior corregido -->
    <div class="container mt-5 pt-4">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-6">
                <div class="card shadow-lg border-0">
                    <!-- Cabecera del formulario con título visible -->
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="card-title text-center mb-0">
                            <i class="fas fa-calendar-plus me-2"></i>Formulario de Creación de Evento
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="form" autocomplete="off">
                            <div class="mb-4">
                                <label for="titulo_e" class="form-label fw-bold">Título del Evento</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-heading"></i></span>
                                    <input type="text" id="titulo_e" name="titulo" class="form-control form-control-lg" 
                                        placeholder="Ingrese el título del evento" required>
                                </div>
                            </div>
                            
                            <div class="row mb-4">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label for="fecha" class="form-label fw-bold">Fecha</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="far fa-calendar-alt"></i></span>
                                        <input type="date" id="fecha" name="fecha" class="form-control" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="hora" class="form-label fw-bold">Hora</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="far fa-clock"></i></span>
                                        <input type="time" id="hora" name="hora" class="form-control" required>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="categoria" class="form-label fw-bold">Categoría</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-tag"></i></span>
                                    <select id="categoria" name="categoria" class="form-select" required>
                                        <option value="" selected disabled>Seleccione una categoría</option>
                                        <option value="Reunión">Reunión</option>
                                        <option value="Cumpleaños">Cumpleaños</option>
                                        <option value="Conferencia">Conferencia</option>
                                        <option value="Taller">Taller</option>
                                        <option value="Otro">Otro</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="descripcion" class="form-label fw-bold">Descripción</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-align-left"></i></span>
                                    <textarea id="descripcion" name="descripcion" class="form-control" rows="2"
                                        placeholder="Describa el evento con detalle" required></textarea>
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg py-3">
                                    <i class="fas fa-save me-2"></i>Guardar Evento
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("form").addEventListener("submit", function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            console.log(data);
            
            // Mostrar feedback visual al enviar
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Guardando...';
            submitBtn.disabled = true;
            
            fetch("guardar.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data),
            })
                .then((response) => response.json())
                .then((result) => {
                    if (result.success) {
                        alert("Datos guardados exitosamente.");
                        this.reset();
                    } else {
                        alert("Error al guardar los datos.");
                    }
                })
                .catch((error) => {
                    console.error("Error:", error);
                    alert("Error al guardar los datos.");
                });
        });
    </script>
    <script src="../assets/js/menu.js"></script>
</body>
</html>
